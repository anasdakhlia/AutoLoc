spring.application.name=autoloc-api

# ── Datasource MySQL ──────────────────────────
# URL de connexion (la base est créée si elle n'existe pas)
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
# Identifiants MySQL (XAMPP : root sans mot de passe par défaut)
spring.datasource.username=root
spring.datasource.password=

# ── JPA / Hibernate ───────────────────────────
# Stratégie de génération des tables : update
spring.jpa.hibernate.ddl-auto=update
# Affiche les requêtes SQL générées dans la console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Logs ──────────────────────────────────────
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO